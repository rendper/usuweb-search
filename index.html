<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuweb Browser & Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <div class="browser-header">
        <div class="logo-container">
            <img src="logo.png" alt="Usuweb Logo" class="app-logo">
            <span class="logo-text">Usu<span>web</span></span>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search Usuweb or enter website address..." onkeypress="handleKeyPress(event)">
            <button onclick="navigateOrSearch()">Go</button>
            <button onclick="loadUsuwebNews()" style="background-color: #2a2a2a; color: #4db8ff; border: 1px solid #4db8ff;">News</button>
        </div>
    </div>

    <div class="main-content">
        <div id="results" class="results-container"></div>
        <iframe id="webViewer" class="web-viewer" style="display: none;"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
