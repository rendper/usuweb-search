<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuweb Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="logo">Usu<span>web</span></h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search the web with Usuweb..." onkeypress="handleKeyPress(event)">
            <button onclick="performSearch()">Search</button>
        </div>

        <div id="results" class="results-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
